name: Compile LaTeX Resume

on:
  push:
    branches:
      - main

# Gives the workflow permission to write changes back to your repository
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          compiler: xelatex

      - name: Rename PDF Output
        run: mv main.pdf "dikshant resume.pdf"

      - name: Commit and Push PDF directly to Repo
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add "dikshant resume.pdf"
          git commit -m "Automated update: dikshant resume.pdf [skip ci]" || echo "No changes to commit"
          git push origin main
